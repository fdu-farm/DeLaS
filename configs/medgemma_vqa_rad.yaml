seed: 42
device: cuda:0

dataset:
  huggingface_id: flaviagiammarino/vqa-rad
  split: null
  max_samples: null
  validation_fraction: 0.2

model:
  path: google/medgemma-4b-it
  max_new_tokens: 200
  torch_dtype: bfloat16

generation:
  num_consistency_samples: 10
  temperature: 1.0
  top_p: 0.9
  intervention:
    rotation_degrees: 10
    translate: 0.1
    gaussian_std: 0.07

screening:
  label_column: hallucination_label
  train_split: train
  test_split: test
  entailment_model: microsoft/deberta-v2-xlarge-mnli

calibration:
  label_column: correctness_label
  validation_split: validation
  test_split: test
  measures:
    - ViP
    - AvgProb
    - MaxProb
    - AvgEnt
    - MaxEnt
    - SEnt
    - SEne
    - VASE
    - RadFlag

paths:
  output_root: outputs

labeling:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  model: qwen-plus
