name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Include the command, configuration changes, and smallest reproducible example.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Include OS, Python, PyTorch, Transformers, CUDA, and GPU versions.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Privacy
      options:
        - label: I have removed API keys, patient data, private paths, and other sensitive information.
          required: true

